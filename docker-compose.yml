# Runs Votetogether with its own Postgres: `docker compose up -d --build`, then open
# http://<this machine's address>:5174 on the TV. Settings come from the environment or a .env file
# next to this one; see "Running with Docker" in the README.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: votetogether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votetogether}
      POSTGRES_DB: vote_together
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U votetogether -d vote_together']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      VOTE_TOGETHER_PG_URL: postgres://votetogether:${POSTGRES_PASSWORD:-votetogether}@db:5432/vote_together
      # The address the TV tells players to join at, e.g. http://192.168.1.20:5174 or a domain.
      # Leave it empty to show whatever address the TV was opened with.
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - '${PORT:-5174}:3000'
    restart: unless-stopped

volumes:
  db-data:
